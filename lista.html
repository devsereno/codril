<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Divergências</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-[#020617] text-slate-900 dark:text-slate-100 min-h-screen">

  <!-- Barra Superior -->
  <nav class="w-full bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 mb-6 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div id="avatarUser" class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg"></div>
        <div>
          <p id="nomeExibicao" class="font-semibold text-slate-900 dark:text-white">Carregando...</p>
        </div>
      </div>
      <button onclick="logout()" class="text-red-500 text-sm font-bold">Sair</button>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto p-4">
    <h1 class="text-2xl font-black mb-6">Divergências</h1>
    
    <div id="status" class="mb-4 text-sm">Carregando dados...</div>
    
    <div id="gridCards" class="grid grid-cols-1 gap-4"></div>
  </div>

  <script>
    function logout() {
      localStorage.clear();
      location.href = 'login.html';
    }

    async function carregarDados() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = "🔄 Conectando ao servidor...";

      try {
        console.log("Fazendo requisição...");
        const res = await fetch("https://codril.onrender.com/api/salvar-produto.php");
        
        console.log("Status da resposta:", res.status);
        
        const data = await res.json();
        console.log("Dados recebidos:", data);

        if (data.success && data.itens) {
          statusEl.textContent = `✅ Total: ${data.itens.length} registros`;
          
          let html = '';
          data.itens.forEach(item => {
            html += `
              <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border">
                <h2 class="font-bold">Endereço: ${item.endereco}</h2>
                <p>SKU: ${item.codigo_produto} • Lote: ${item.lote}</p>
                \( {item.descricao ? `<p class="text-sm text-slate-500"> \){item.descricao}</p>` : ''}
              </div>`;
          });
          
          document.getElementById('gridCards').innerHTML = html || '<p class="text-center py-10">Nenhum item encontrado.</p>';
        } else {
          statusEl.textContent = "⚠️ Nenhum item encontrado";
        }
      } catch (err) {
        console.error("Erro completo:", err);
        statusEl.innerHTML = `❌ Erro ao carregar.<br><small>${err.message}</small>`;
      }
    }

    window.onload = carregarDados;
  </script>
</body>
</html>
