<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante Banco de Horas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    img { max-width: 100%; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { padding: 12px 20px; margin: 10px 5px 10px 0; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    .preview { text-align: center; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
    h1 { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Sistema de Comprovantes - Banco de Horas</h1>

    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    
    <div class="preview">
      <img id="previewImg" src="" alt="Pré-visualização da imagem">
    </div>

    <button onclick="processImage()">🔍 Ler Dados com OCR</button>
    <button onclick="saveComprovante()">💾 Salvar Comprovante</button>

    <h2>Dados Extraídos</h2>
    <form id="dataForm">
      <div class="form-group">
        <label>Mês/Ano</label>
        <input type="text" id="mesAno" placeholder="Maio, 2026">
      </div>
      <div class="form-group">
        <label>Banco de Horas (Topo)</label>
        <input type="text" id="bancoTopo" placeholder="02:18">
      </div>
      <div class="form-group">
        <label>Saldo Total Banco de Horas</label>
        <input type="text" id="saldoTotal" placeholder="63:28">
      </div>

      <h3>Resumo Mensal</h3>
      <div class="form-group">
        <label>Horas Previstas</label>
        <input type="text" id="horasPrevistas" placeholder="193:36">
      </div>
      <div class="form-group">
        <label>Tiradentes / Feriados</label>
        <input type="text" id="tiradentes" placeholder="08:48">
      </div>
      <div class="form-group">
        <label>Horas Trabalhadas</label>
        <input type="text" id="horasTrabalhadas" placeholder="215:15">
      </div>
      <div class="form-group">
        <label>Adicional Noturno</label>
        <input type="text" id="adicionalNoturno" placeholder="34:18">
      </div>
      <div class="form-group">
        <label>Dia Mundial do Trabalho</label>
        <input type="text" id="diaMundial" placeholder="08:48">
      </div>
      <div class="form-group">
        <label>Hora Extra 75%</label>
        <input type="text" id="horaExtra" placeholder="07:40">
      </div>
      <div class="form-group">
        <label>Horas Mensais Positivas</label>
        <input type="text" id="positivas" placeholder="41:55">
      </div>
      <div class="form-group">
        <label>Horas Mensais Negativas</label>
        <input type="text" id="negativas" placeholder="-06:09">
      </div>
      <div class="form-group">
        <label>Banco de Horas Acumulado (até mês anterior)</label>
        <input type="text" id="saldoAnterior" placeholder="27:42">
      </div>
      <div class="form-group">
        <label>Banco de Horas no Mês</label>
        <input type="text" id="bancoNoMes" placeholder="35:46">
      </div>
      <div class="form-group">
        <label>Observações</label>
        <textarea id="observacoes" rows="4" placeholder="Qualquer observação adicional..."></textarea>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
  <script>
    let currentImageBase64 = null;

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('previewImg').src = e.target.result;
        currentImageBase64 = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function processImage() {
      const img = document.getElementById('previewImg');
      if (!img.src) return alert("Faça upload de uma imagem primeiro!");

      const status = document.createElement('p');
      status.textContent = "🔄 Processando OCR... Aguarde";
      document.body.appendChild(status);

      try {
        const worker = await Tesseract.createWorker('por', 1);
        const result = await worker.recognize(img.src);
        const text = result.data.text;
        await worker.terminate();

        console.log("Texto OCR:", text);

        // Extrações melhoradas
        document.getElementById('mesAno').value = text.match(/Maio,\s*2026/i) ? "Maio, 2026" : "";
        document.getElementById('bancoTopo').value = text.match(/BANCO DE HORAS:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('saldoTotal').value = text.match(/SALDO:\s*(\d+:\d+)/i)?.[1] || 
                                                     text.match(/\+?\s*(\d+:\d+)/)?.[1] || "";
        
        document.getElementById('horasPrevistas').value = text.match(/Horas Previstas:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('tiradentes').value = text.match(/Tiradentes:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('horasTrabalhadas').value = text.match(/Horas Trabalhadas:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('adicionalNoturno').value = text.match(/Adicional Noturno:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('diaMundial').value = text.match(/Dia Mundial do Trabalho:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('horaExtra').value = text.match(/HORA EXTRA 75%:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('positivas').value = text.match(/Horas mensais positivas:\s*(\d+:\d+)/i)?.[1] || "";
        document.getElementById('negativas').value = text.match(/Horas mensais negativas:\s*(-?\d+:\d+)/i)?.[1] || "";
        document.getElementById('saldoAnterior').value = text.match(/até Abril.*?(\d+:\d+)/i)?.[1] || "";
        document.getElementById('bancoNoMes').value = text.match(/Banco de horas no mês:\s*(\d+:\d+)/i)?.[1] || "";

        status.textContent = "✅ Dados extraídos com sucesso!";
        status.className = "success";

      } catch (err) {
        console.error(err);
        status.textContent = "❌ Erro ao processar OCR.";
        status.className = "error";
      }
    }

    function saveComprovante() {
      if (!currentImageBase64) return alert("Faça upload da imagem primeiro!");

      const data = {
        dataSalvamento: new Date().toLocaleString('pt-BR'),
        mesAno: document.getElementById('mesAno').value,
        bancoTopo: document.getElementById('bancoTopo').value,
        saldoTotal: document.getElementById('saldoTotal').value,
        horasPrevistas: document.getElementById('horasPrevistas').value,
        tiradentes: document.getElementById('tiradentes').value,
        horasTrabalhadas: document.getElementById('horasTrabalhadas').value,
        adicionalNoturno: document.getElementById('adicionalNoturno').value,
        diaMundial: document.getElementById('diaMundial').value,
        horaExtra: document.getElementById('horaExtra').value,
        positivas: document.getElementById('positivas').value,
        negativas: document.getElementById('negativas').value,
        saldoAnterior: document.getElementById('saldoAnterior').value,
        bancoNoMes: document.getElementById('bancoNoMes').value,
        observacoes: document.getElementById('observacoes').value,
        imagem: currentImageBase64
      };

      let comprovantes = JSON.parse(localStorage.getItem('comprovantes')) || [];
      comprovantes.push(data);
      localStorage.setItem('comprovantes', JSON.stringify(comprovantes));

      alert("✅ Comprovante salvo com sucesso!");
      console.log("Salvo:", data);
    }
  </script>
</body>
</html>
