<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante Banco de Horas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    img { max-width: 100%; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    
    button { 
      padding: 12px 20px; 
      margin: 10px 5px 10px 0; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 16px;
      transition: all 0.3s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #6c757d; cursor: not-allowed; }

    .preview { text-align: center; }
    
    #statusMessage {
      margin: 15px 0;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      min-height: 20px;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* Barra de progresso */
    #progressContainer {
      display: none;
      margin: 15px 0;
    }
    .progress-bar {
      height: 10px;
      background: linear-gradient(90deg, #007bff, #00c6ff);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 5px;
    }
    .progress-text {
      text-align: center;
      margin-top: 5px;
      font-size: 14px;
      color: #555;
    }

    h1 { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Sistema de Comprovantes - Banco de Horas</h1>

    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    
    <div class="preview">
      <img id="previewImg" src="" alt="Pré-visualização da imagem">
    </div>

    <div style="margin: 15px 0;">
      <button id="ocrBtn" onclick="processImage()">🔍 Ler Dados com OCR</button>
      <button id="saveBtn" onclick="saveComprovante()">💾 Salvar Comprovante</button>
    </div>

    <!-- Barra de Progresso -->
    <div id="progressContainer">
      <div style="background: #e9ecef; border-radius: 5px; height: 10px; overflow: hidden;">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="progressText" class="progress-text">0% - Processando OCR...</div>
    </div>

    <!-- Mensagem de status -->
    <div id="statusMessage"></div>

    <h2>Dados Extraídos</h2>
    <form id="dataForm">
      <div class="form-group">
        <label>Mês/Ano</label>
        <input type="text" id="mesAno" placeholder="Maio, 2026">
