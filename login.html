<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pulmão AE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold text-blue-400">Pulmão AE</h1>
    </div>
    <form id="formLogin" onsubmit="processarLogin(event)" class="space-y-4">
      <input type="email" id="loginEmail" required placeholder="E-mail" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm">
      <input type="password" id="loginSenha" required placeholder="Senha" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm">
      <button id="btnLogin" type="submit" class="w-full bg-blue-600 py-3.5 rounded-xl text-xs font-bold text-white">Entrar</button>
    </form>
  </div>

  <script>
    async function processarLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginSenha').value;

      try {
        const res = await fetch('https://codril.onrender.com/api/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await res.json();

        if (data.success) {
          // SALVA O OBJETO DO USUÁRIO NO LOCALSTORAGE
          localStorage.setItem('currentUser', JSON.stringify({
            nome: data.user.nome,
            email: data.user.email
          }));
          window.location.href = 'index.html';
        } else {
          alert(data.message || "Credenciais incorretas.");
        }
      } catch (err) { alert("Erro de conexão."); }
    }
  </script>
</body>
</html>
