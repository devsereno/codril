<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Nova Divergência - Pulmão AE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-[#020617] text-slate-900 dark:text-slate-100 min-h-screen">
  
  <nav class="w-full bg-white dark:bg-slate-900 border-b p-4 mb-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div id="avatar" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-white">U</div>
        <p id="userName" class="font-semibold">Carregando...</p>
      </div>
      <button onclick="localStorage.clear(); location.href='login.html'" class="text-xs text-red-500 font-bold">SAIR</button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-3xl font-black mb-8">Nova Divergência</h1>
    
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800">
      <div class="grid grid-cols-1 gap-4">
        <input id="endereco" placeholder="Endereço" class="bg-slate-100 dark:bg-slate-800 rounded-2xl px-5 py-4 font-bold">
        <input id="codigo" placeholder="SKU" class="bg-slate-100 dark:bg-slate-800 rounded-2xl px-5 py-4 font-bold">
        <input id="lote" placeholder="Lote" class="bg-slate-100 dark:bg-slate-800 rounded-2xl px-5 py-4 font-bold">
        <input id="quantidade" type="number" placeholder="Quantidade" class="bg-slate-100 dark:bg-slate-800 rounded-2xl px-5 py-4 font-bold">
        <select id="status_estoque" class="bg-slate-100 dark:bg-slate-800 rounded-2xl px-5 py-4 font-bold">
          <option value="SOBRANDO">🟢 Sobrando</option>
          <option value="FALTANDO">🔴 Faltando</option>
        </select>
        <button onclick="toggleDescricao()" class="text-blue-500 text-xs font-bold text-left">+ Observação</button>
        <input id="descricao" placeholder="Descrição..." class="hidden w-full bg-slate-100 dark:bg-slate-800 rounded-2xl px-5 py-4">
      </div>
      <button onclick="cadastrarProduto()" class="mt-8 w-full bg-blue-600 py-5 rounded-2xl font-black text-white">SALVAR REGISTRO</button>
    </div>
  </div>

  <script>
    // CARREGA E VALIDA O USUÁRIO AO ABRIR
    window.onload = () => {
      const userRaw = localStorage.getItem('currentUser');
      if (!userRaw) { location.href = 'login.html'; return; }
      
      const user = JSON.parse(userRaw);
      document.getElementById('userName').textContent = user.nome;
      document.getElementById('avatar').textContent = user.nome.charAt(0).toUpperCase();
    };

    function toggleDescricao() { document.getElementById('descricao').classList.toggle('hidden'); }

    async function cadastrarProduto() {
      const dados = {
        endereco: document.getElementById('endereco').value,
        codigo_produto: document.getElementById('codigo').value,
        lote: document.getElementById('lote').value,
        quantidade: document.getElementById('quantidade').value,
        status_estoque: document.getElementById('status_estoque').value,
        descricao: document.getElementById('descricao').value
      };

      const res = await fetch('https://codril.onrender.com/api/salvar-produto.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      
      if ((await res.json()).success) { alert("Salvo com sucesso!"); }
    }
  </script>
</body>
</html>
