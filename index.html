<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Divergência - Pulmão AE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-slate-50 dark:bg-[#020617] text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">
  
  <!-- BARRA SUPERIOR PADRONIZADA -->
  <nav class="w-full bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 mb-6 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div id="avatar" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-white shadow-lg text-xl">U</div>
        <div>
          <h1 class="text-[10px] uppercase font-bold text-slate-400">Logado como:</h1>
          <p id="userName" class="font-semibold text-slate-900 dark:text-white">Carregando...</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-lg hover:scale-110 transition">🌓</button>
        <a href="perfil.html" class="text-blue-500 hover:text-blue-600 text-sm font-medium">⚙️ Perfil</a>
        <button onclick="logout()" class="px-4 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs font-bold rounded-xl border border-red-200 dark:border-red-900/50">SAIR</button>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-4">
    <div class="flex items-center gap-3 mb-8">
      <span class="text-4xl">📦</span>
      <h1 class="text-3xl font-black tracking-tight">Nova Divergência</h1>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 mb-8 border border-slate-200 dark:border-slate-800 shadow-sm">
      <h2 class="text-lg font-black mb-6 flex items-center gap-2">
        <span class="text-blue-500">➕</span> Detalhes do Registo
      </h2>

      <div class="grid grid-cols-1 gap-4">
        <label class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black">Operação</label>
        <select id="tipo" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold">
          <option value="pulmao">📦 Pulmão AE</option>
          <option value="picking">🛒 Picking</option>
        </select>

        <label class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black">Endereço</label>
        <input id="endereco" placeholder="Ex: 101" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold">

        <label class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black">Código do Produto</label>
        <input id="codigo" placeholder="SKU" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold">

        <label class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black">Lote</label>
        <input id="lote" placeholder="Lote" maxlength="20" oninput="this.value = this.value.toUpperCase()" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold uppercase">

        <label class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black">Quantidade</label>
        <input id="quantidade" type="number" placeholder="0" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold">

        <label class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-black">Status</label>
        <select id="status_estoque" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold">
          <option value="Normal">🟢 Normal</option>
          <option value="SOBRANDO">🟢 Sobrando</option>
          <option value="FALTANDO">🔴 Faltando</option>
        </select>

        <button type="button" onclick="toggleDescricao()" class="text-blue-500 text-xs font-bold mt-2 flex items-center gap-2">
          <span>📝</span> Adicionar Observação
        </button>
        <div id="containerDescricao" class="hidden">
          <input id="descricao" placeholder="Escreva algo aqui..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-medium">
        </div>
      </div>

      <button onclick="cadastrarProduto()" class="mt-8 w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-2xl font-black text-white transition-all shadow-lg shadow-blue-600/20">
        💾 SALVAR REGISTRO
      </button>
    </div>

    <a href="lista.html" class="block text-center bg-slate-200 dark:bg-slate-800 py-5 rounded-2xl text-center font-black hover:opacity-80 transition-opacity">
      📋 Ver Listagem Completa
    </a>
  </div>

  <script>
    // ====================== PROTEÇÃO DE LOGIN ======================
    function verificarLogin() {
      const userRaw = localStorage.getItem('currentUser');
      if (!userRaw) {
        window.location.href = 'login.html';
        return null;
      }
      return JSON.parse(userRaw);
    }

    // ====================== ATUALIZAR BARRA ======================
    function atualizarBarra(user) {
      document.getElementById('userName').textContent = user.nome || 'Operador';
      document.getElementById('avatar').textContent = (user.nome || 'U').charAt(0).toUpperCase();
    }

    // ====================== CADASTRO ======================
    async function cadastrarProduto() {
      const user = verificarLogin();
      if (!user) return;

      const dados = {
        tipo: document.getElementById('tipo').value,
        endereco: document.getElementById('endereco').value.trim(),
        codigo_produto: document.getElementById('codigo').value.trim(),
        lote: document.getElementById('lote').value.trim().toUpperCase(),
        descricao: document.getElementById('descricao').value.trim(),
        quantidade: parseInt(document.getElementById('quantidade').value) || 1,
        status_estoque: document.getElementById('status_estoque').value
      };

      if (!dados.endereco || !dados.codigo_produto || !dados.lote) {
        alert("⚠️ Preencha Endereço, Código e Lote!");
        return;
      }

      try {
        const res = await fetch('https://codril.onrender.com/api/salvar-produto.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const result = await res.json();
        if (result.success) {
          alert("✅ Registro salvo com sucesso!");
          limparFormulario();
        } else {
          alert("❌ " + (result.message || "Erro ao salvar"));
        }
      } catch (e) {
        alert("❌ Erro de conexão com o servidor.");
      }
    }

    function limparFormulario() {
      document.getElementById('endereco').value = '';
      document.getElementById('codigo').value = '';
      document.getElementById('lote').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('quantidade').value = '';
      document.getElementById('containerDescricao').classList.add('hidden');
    }

    function toggleDescricao() {
      document.getElementById('containerDescricao').classList.toggle('hidden');
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // ====================== INICIALIZAÇÃO ======================
    window.onload = function() {
      const user = verificarLogin();
      if (user) atualizarBarra(user);
    };
  </script>
</body>
</html>
